# Cloudflare Worker for the ticket triage demo. Deployed by .github/workflows/deploy-worker.yml.
name = "ticket-triage"
main = "src/index.js"
compatibility_date = "2025-06-01"

# 10 new messages per minute per visitor; repeats come from the cache and don't count
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1004"
simple = { limit = 10, period = 60 }

# Bring your own teams: 12 batches (of up to 10 messages) per minute per visitor
[[ratelimits]]
name = "BATCH_LIMITER"
namespace_id = "1005"
simple = { limit = 12, period = 60 }

# GEMINI_API_KEY is set as an encrypted secret by the deploy workflow, never in this file.
